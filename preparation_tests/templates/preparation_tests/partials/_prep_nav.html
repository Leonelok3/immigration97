<style>
.prep-subnav{
  background:#050b18;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:.9rem 1.25rem;
}
.prep-subnav .container{max-width:1080px;margin:0 auto;}
.prep-subnav .row,.prep-subnav .col-12{display:block;}
.prep-subnav__list{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  align-items:center;
  gap:.5rem;
  flex-wrap:wrap;
}
.prep-subnav__list li{margin:0;padding:0;}
.prep-subnav__list a,
.prep-subnav__list .nav-disabled{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  min-height:36px;
  padding:.45rem .75rem;
  border-radius:999px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.72);
  font-size:.78rem;
  font-weight:800;
  text-decoration:none;
  white-space:nowrap;
}
.prep-subnav__list a:hover{
  background:rgba(212,168,67,.13);
  border-color:rgba(212,168,67,.3);
  color:#f0c060;
}
.prep-subnav__list .is-active a{
  background:rgba(212,168,67,.16);
  border-color:rgba(212,168,67,.42);
  color:#f0c060;
}
.prep-subnav__list .nav-disabled{
  opacity:.45;
  cursor:not-allowed;
}
@media(max-width:640px){
  .prep-subnav{padding:.75rem;}
  .prep-subnav__list{gap:.35rem;}
  .prep-subnav__list a,
  .prep-subnav__list .nav-disabled{font-size:.72rem;padding:.4rem .6rem;}
}
</style>

<nav class="prep-subnav" aria-label="Navigation préparation">
  <div class="container">
    <div class="row">
      <div class="col-12">

        <ul class="prep-subnav__list">

          <!-- 🎧 CO — Compréhension Orale -->
          <li class="{% if '/prep/fr/co' in request.path %}is-active{% endif %}">
            <a href="{% url "preparation_tests:co_hub" %}">
              <span class="icon">🎧</span>
              <span class="label">CO</span>
            </a>
          </li>

          <!-- 📖 CE — Compréhension Écrite -->
          <li class="{% if '/prep/fr/ce' in request.path %}is-active{% endif %}">
            <a href="{% url "preparation_tests:ce_hub" %}">
              <span class="icon">📖</span>
              <span class="label">CE</span>
            </a>
          </li>

          <!-- 🎤 EO — Expression Orale -->
          <li class="{% if '/prep/fr/eo' in request.path %}is-active{% endif %}">
            <a href="{% url "preparation_tests:eo_hub" %}">
              <span class="icon">🎤</span>
              <span class="label">EO</span>
            </a>
          </li>

          <!-- ✍️ EE — Expression Écrite -->
          <li class="{% if '/prep/fr/ee' in request.path %}is-active{% endif %}">
            <a href="{% url "preparation_tests:ee_hub" %}">
              <span class="icon">✍️</span>
              <span class="label">EE</span>
            </a>
          </li>

          <!-- ⏱️ EXAMEN BLANC -->
          <li>
            {% if exam_code and section %}
              <a href="{% url "preparation_tests:start_mock_exam" exam_code section %}">
                <span class="icon">⏱️</span>
                <span class="label">Examen blanc</span>
              </a>
            {% else %}
              <span class="nav-disabled">
                <span class="icon">⏱️</span>
                <span class="label">Examen blanc</span>
              </span>
            {% endif %}
          </li>

          <!-- 📜 HISTORIQUE -->
          <li>
            <a href="{% url "preparation_tests:session_review" %}">
              <span class="icon">📜</span>
              <span class="label">Historique</span>
            </a>
          </li>

          <!-- 📈 PROGRESSION -->
          <li>
            <a href="{% url "preparation_tests:dashboard_global" %}">
              <span class="icon">📈</span>
              <span class="label">Progression</span>
            </a>
          </li>

          <!-- 🎯 AMÉLIORER -->
          <li>
            <a href="{% url "preparation_tests:dashboard_global" %}">
              <span class="icon">🎯</span>
              <span class="label">Améliorer</span>
            </a>
          </li>

          <!-- 🤖 COACH IA -->
          <li>
            <a href="{% url "preparation_tests:coach_ai_history" %}">
              <span class="icon">🤖</span>
              <span class="label">Coach IA</span>
            </a>
          </li>

          <!-- ℹ️ EXAMEN (SECONDARY) -->
          <li class="prep-subnav__secondary">
            {% if exam_code %}
              <a href="{% url "preparation_tests:exam_detail" exam_code %}">
                <span class="icon">ℹ️</span>
                <span class="label">Examen</span>
              </a>
            {% else %}
              <span class="nav-disabled">
                <span class="icon">ℹ️</span>
                <span class="label">Examen</span>
              </span>
            {% endif %}
          </li>

        </ul>

      </div>
    </div>
  </div>
</nav>
